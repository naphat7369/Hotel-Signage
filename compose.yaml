services:
  signage:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - signage-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  signage-data:
